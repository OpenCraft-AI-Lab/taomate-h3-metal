# Modified by OpenCraft AI Lab for the Metal/MPS port, 2026; see LICENSE and NOTICE.
[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taomate-h3-metal"
version = "0.1.0"
description = "Experimental Apple Silicon Metal/MPS backend for TaoMate-H3 audio-video generation"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = "LicenseRef-MiniMax-H3-Community"
license-files = ["LICENSE", "NOTICE", "MODIFICATIONS.md"]
authors = [{name = "TaoMate-H3 Contributors"}, {name = "OpenCraft AI Lab"}]
dependencies = [
  "torch>=2.4",
  "torchvision>=0.19",
  "diffusers==0.35.2",
  "einops>=0.7",
  "huggingface-hub>=0.34",
  "numpy>=1.26",
  "Pillow>=10",
  "PyYAML>=6",
  "safetensors>=0.4.5",
  "tokenizers==0.22.1",
  "transformers==4.57.6",
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: GPU :: NVIDIA CUDA",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Multimedia :: Video",
]

[project.optional-dependencies]
metal = ["torch==2.14.1", "torchvision==0.29.1"]
test = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
taomate-h3-metal = "taomate_h3.cli:main"

[project.urls]
Homepage = "https://github.com/OpenCraft-AI-Lab/taomate-h3-metal"
Issues = "https://github.com/OpenCraft-AI-Lab/taomate-h3-metal/issues"
Upstream = "https://github.com/TaoLiveAIGC/TaoMate-H3"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
